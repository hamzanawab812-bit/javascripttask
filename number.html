<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Number Methods</title>

  <style>
    body{
      font-family: Arial;
      background:#f4f4f4;
      padding:20px;
    }

    .container{
      max-width:900px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.2);
    }

    h1{
      text-align:center;
      color:#333;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
    }

    th, td{
      border:1px solid #ccc;
      padding:10px;
      text-align:left;
    }

    th{
      background:#007bff;
      color:white;
    }

    tr:nth-child(even){
      background:#f9f9f9;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>JavaScript Number Methods</h1>

    <table>
      <thead>
        <tr>
          <th>Method</th>
          <th>Output</th>
        </tr>
      </thead>

      <tbody id="result"></tbody>
    </table>
  </div>

  <script src="number.js"></script>

</body>
</html>
